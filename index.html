<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#184c37"><title>V4B – Pulje 2</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#20352c;font:16px system-ui,sans-serif}header{background:#184c37;color:white;padding:20px}header div,main{max-width:850px;margin:auto}h1{margin:0;font-size:27px}header p{margin:5px 0}main{padding:14px}section,.panel{background:white;border:1px solid #d8e3da;border-radius:14px;padding:15px;margin:12px 0}button,select,input{font:inherit;border:1px solid #b9c9bf;border-radius:8px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}button.primary,button.active{background:#184c37;color:white;border-color:#184c37}nav,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}nav button{flex:1;min-width:125px}select{max-width:100%;width:100%}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}small,.muted{color:#60746a}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:center;padding:5px 2px;border-bottom:1px solid #e5ebe6}th:first-child,td:first-child{text-align:left;width:29%}.slot{width:100%;min-height:40px;padding:4px;background:#f4f6f4}.slot.on{background:#d0ead7;color:#155d32;border-color:#64a77a;font-weight:bold}.match{border-top:1px solid #e1e9e2;padding:13px 0}.match:first-of-type{border-top:0}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#e2eee4;font-size:13px}.warn{background:#fff2d5;color:#63470b;padding:10px;border-radius:8px}.error{color:#a32323}.spacer{flex:1}#status{font-size:13px}label{display:block;margin:8px 0 5px}input[type=text]{width:100%}details{margin-top:8px}summary{cursor:pointer}button.danger{color:#a32323} @media(max-width:420px){main{padding:8px}section{padding:10px}button{font-size:14px}th,td{font-size:13px}}
</style></head><body><header><div><h1>V4B – Pulje 2</h1><p>Vinterturnering · 26.11.2026 – 28.02.2027</p><div id="status">Starter …</div></div></header><main><div id="notice"></div><section><label for="team">Mit navn</label><select id="team"></select></section><nav id="nav"></nav><div id="view"></div></main>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const names=['Frank Larsen / Peter Jacobsen','Niels Jørgensen / Henrik Fogtmann','Peter T. Petersen / Jan Westfael Larsen','Jan Dam Jensen / Henning Bast Nielsen','Leif Hansen / Henning Mortensen'];
const players=names.flatMap(n=>n.split(' / '));
const short=['Frank / Peter','Niels / Henrik','Peter / Jan W.','Jan D. / Henning B.','Leif / Henning M.'];
const times=['10:00','11:00','12:00','13:00']; const start='2026-11-26',end='2027-02-28';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const date=s=>new Date(s+'T12:00:00');const add=(s,n)=>{let d=date(s);d.setDate(d.getDate()+n);return iso(d)};const fmt=s=>date(s).toLocaleDateString('da-DK',{weekday:'short',day:'numeric',month:'numeric'});const monday=s=>add(s,-((date(s).getDay()+6)%7));const today=iso(new Date());
const matches=[];for(let a=0;a<5;a++)for(let b=a+1;b<5;b++)matches.push({a,b,id:`${a}-${b}`});
let player=Number(localStorage.getItem('v4b-player')??7),team=Math.floor(player/2),tab=0,week=monday(today<start?start:today>end?end:today),avail={},games={},online=false,ready=false,db,api,auth;
const storage='v4b-pulje2-demo-v2';try{const data=JSON.parse(localStorage.getItem(storage)||'{}');avail=data.avail||{};games=data.games||{}}catch{}
const persist=()=>localStorage.setItem(storage,JSON.stringify({avail,games}));
const status=s=>$('status').textContent=s;const notice=s=>$('notice').innerHTML=s?`<div class="warn">${esc(s)}</div>`:'';
const key=(d,t)=>d+'_'+t.replace(':','');const split=k=>[k.slice(0,10),k.slice(11,13)+':'+k.slice(13,15)];
const busy=(t,d,ignore)=>matches.some(m=>m.id!==ignore&&(m.a===t||m.b===t)&&games[m.id]?.slot?.slice(0,10)===d);
const teamSlots=t=>Object.keys(avail[2*t]||{}).filter(k=>avail[2*t][k]===true&&avail[2*t+1]?.[k]===true);
const options=m=>teamSlots(m.a).filter(k=>teamSlots(m.b).includes(k)&&k.slice(0,10)>=today&&k.slice(0,10)>=start&&k.slice(0,10)<=end&&!busy(m.a,k.slice(0,10),m.id)&&!busy(m.b,k.slice(0,10),m.id)).sort();
async function changeAvailability(changes){if(!ready)return;try{if(online){const updates={};for(const [k,v] of Object.entries(changes))updates[`playerAvailability/${player}/${k}`]=v?true:null;await api.update(api.ref(db),updates)}else{avail[player]??={};for(const [k,v] of Object.entries(changes)){if(v)avail[player][k]=true;else delete avail[player][k]}persist();render()}}catch(e){notice('Kunne ikke gemme: '+e.message)}}
async function changeGame(id,fn){if(!ready)return;try{if(online){const result=await api.runTransaction(api.ref(db,'games'),old=>{const g=old||{};const next=fn(g);return next===undefined?undefined:next});if(!result.committed)notice('Ændringen kunne ikke gemmes. Kontrollér om tiden allerede er optaget.')}else{const next=fn(structuredClone(games));if(next!==undefined){games=next;persist();render()}else notice('Ændringen kunne ikke gemmes.')}}catch(e){notice('Kunne ikke gemme: '+e.message)}}
function book(id,k){const m=matches.find(x=>x.id===id);if(!options(m).includes(k))return notice('Tiden er ikke længere ledig.');if(!confirm(`Aftal ${short[m.a]} mod ${short[m.b]} den ${fmt(split(k)[0])} kl. ${split(k)[1]}?`))return;changeGame(id,g=>{if(g[id]?.slot)return;const conflict=matches.some(x=>x.id!==id&&(x.a===m.a||x.a===m.b||x.b===m.a||x.b===m.b)&&g[x.id]?.slot?.slice(0,10)===k.slice(0,10));if(conflict)return;g[id]={slot:k};return g})}
function cancel(id){if(confirm('Frigiv kampen, så der kan vælges en ny tid?'))changeGame(id,g=>{delete g[id];return g})}
function saveResult(id){const value=$('res-'+id).value.trim(),winner=$('win-'+id).value;if(!value||winner==='')return notice('Angiv både resultat og udfald.');changeGame(id,g=>{if(!g[id]?.slot)return;g[id]={...g[id],result:value,winner};return g})}
function render(){const tabs=['Mine ledige tider','Kampforslag','Kampprogram','Resultater'];$('nav').innerHTML=tabs.map((n,i)=>`<button data-tab="${i}" class="${tab===i?'active':''}">${n}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);render()});$('team').value=player;const own=matches.filter(m=>m.a===team||m.b===team);let html='';
if(tab===0){const ds=Array.from({length:7},(_,i)=>add(week,i));html=`<section><div class="row"><button id="prev" ${week<=monday(start)?'disabled':''}>‹</button><strong class="spacer">${fmt(week)} – ${fmt(add(week,6))}</strong><button id="next" ${week>=monday(end)?'disabled':''}>›</button></div><p class="muted">Markér dine egne ledige tider. Dit holds tider beregnes automatisk. Grøn = ledig. Tom = ikke registreret som ledig.</p><table><thead><tr><th>Dato</th>${times.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${ds.map(d=>`<tr><td>${fmt(d)}</td>${times.map(t=>{const k=key(d,t),on=avail[player]?.[k];return `<td><button class="slot ${on?'on':''}" data-slot="${k}" aria-pressed="${!!on}" aria-label="${d} ${t}" ${d<start||d>end||d<today||!ready?'disabled':''}>${on?'✓':'+'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table><div class="row" style="margin-top:12px"><button id="all">Markér hele ugen</button><button id="clear">Nulstil uge</button><button id="copy">Kopiér til kommende uger</button></div><p><small>${Object.keys(avail[player]||{}).filter(k=>k.slice(0,10)>=today).length} kommende ledige tider registreret. Holdet har ${teamSlots(team).filter(k=>k.slice(0,10)>=today).length} fælles tider.</small></p></section>`;}
if(tab===1){const pending=own.filter(m=>!games[m.id]?.slot).sort((a,b)=>options(a).length-options(b).length);html=`<section><h2>Mine kampforslag</h2><p class="muted">Kampe med færrest fælles tider vises først. Aftal med modstanderen, inden du booker.</p>${pending.length?pending.map(m=>{const opts=options(m);return `<div class="match"><h3>${esc(short[m.a===team?m.b:m.a])}</h3><span class="pill">${opts.length} fælles tider</span>${opts.length?`<div class="row" style="margin-top:10px"><select id="pick-${m.id}" class="spacer">${opts.map(k=>`<option value="${k}">${fmt(split(k)[0])} kl. ${split(k)[1]}</option>`).join('')}</select><button class="primary" data-book="${m.id}">Aftal kamp</button></div>`:'<p class="muted">Ingen fælles ledige tider endnu.</p>'}</div>`}).join(''):'<p>Alle dine kampe er planlagt.</p>'}</section><section><h2>Spillernes registrering</h2>${names.map((n,i)=>`<p><strong>${esc(n)}</strong><br><small>${[2*i,2*i+1].map(j=>esc(players[j])+": "+Object.keys(avail[j]||{}).filter(k=>k.slice(0,10)>=today).length+" tider").join(" · ")}<br>Holdets fælles tider: ${teamSlots(i).filter(k=>k.slice(0,10)>=today).length}</small></p>`).join('')}</section>`;}
if(tab===2){const ordered=[...matches].sort((a,b)=>(games[a.id]?.slot||'z').localeCompare(games[b.id]?.slot||'z'));html=`<section><h2>Kampprogram</h2><p>${matches.filter(m=>games[m.id]?.slot).length} af 10 kampe aftalt</p>${ordered.map(m=>{const g=games[m.id],mine=m.a===team||m.b===team;return `<div class="match"><h3>${esc(short[m.a])} – ${esc(short[m.b])}</h3>${g?.slot?`<span class="pill">${fmt(split(g.slot)[0])} kl. ${split(g.slot)[1]}</span>${g.result?` <strong>${esc(g.result)}</strong>`:''}${mine&&!g.result?` <button class="danger" data-cancel="${m.id}">Flyt / aflys</button>`:''}`:'<small>Ikke aftalt</small>'}</div>`}).join('')}</section>`;}
if(tab===3){const standings=names.map((n,i)=>({i,n,p:0,w:0,d:0,l:0}));for(const m of matches){const g=games[m.id];if(!g?.result)continue;for(const i of [m.a,m.b]){let s=standings[i];s.p++;if(g.winner==='draw')s.d++;else if(g.winner===String(i))s.w++;else s.l++}}html=`<section><h2>Resultatoversigt</h2><p class="muted">Vundet, delt og tabt – ingen officiel pointberegning er antaget.</p><table><tr><th>Hold</th><th>K</th><th>V</th><th>D</th><th>T</th></tr>${standings.map(s=>`<tr><td>${esc(short[s.i])}</td><td>${s.p}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td></tr>`).join('')}</table></section><section><h2>Mine kampresultater</h2>${own.filter(m=>games[m.id]?.slot).map(m=>{let g=games[m.id];return `<div class="match"><h3>${esc(short[m.a])} – ${esc(short[m.b])}</h3><small>${fmt(split(g.slot)[0])}</small><label>Resultat</label><input type="text" id="res-${m.id}" maxlength="80" value="${esc(g.result||'')}" placeholder="Fx 3&2"><label>Udfald</label><select id="win-${m.id}"><option value="">Vælg udfald</option>${[String(m.a),String(m.b),'draw'].map((v,i)=>`<option value="${v}" ${g.winner===v?'selected':''}>${esc(i===2?'Delt':short[Number(v)])}</option>`).join('')}</select><button class="primary" style="margin-top:8px" data-result="${m.id}">Gem resultat</button></div>`}).join('')||'<p>Ingen aftalte kampe endnu.</p>'}</section>`;}
$('view').innerHTML=html;if(tab===0){$('copy').onclick=()=>{const n=Number(prompt('Hvor mange kommende uger skal kopieres? (1–13)', '1'));if(!Number.isInteger(n)||n<1||n>13)return;if(!confirm('Kopiér ugens mønster til '+n+' kommende uger? Eksisterende tider i disse uger erstattes.'))return;const c={};for(let w=1;w<=n;w++)for(let i=0;i<7;i++)for(const t of times){const d=add(week,w*7+i);if(d>=start&&d<=end&&d>=today)c[key(d,t)]=!!avail[player]?.[key(add(week,i),t)]}changeAvailability(c)};$('prev').onclick=()=>{week=add(week,-7);render()};$('next').onclick=()=>{week=add(week,7);render()};$('view').querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>changeAvailability({[b.dataset.slot]:!avail[player]?.[b.dataset.slot]}));for(const [id,v] of [['all',true],['clear',false]])$(id).onclick=()=>{const c={};for(let i=0;i<7;i++){const d=add(week,i);if(d>=start&&d<=end&&d>=today)for(const t of times)c[key(d,t)]=v}changeAvailability(c)}}$('view').querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>book(b.dataset.book,$('pick-'+b.dataset.book).value));$('view').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancel(b.dataset.cancel));$('view').querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>saveResult(b.dataset.result));}
$('team').innerHTML=players.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');$('team').onchange=()=>{player=Number($('team').value);team=Math.floor(player/2);localStorage.setItem('v4b-player',player);render()};
if(!firebaseConfig?.databaseURL){ready=true;status('Demotilstand – kun gemt i denne browser');notice('Demo: Data deles ikke med andre spillere endnu. Firebase skal tilsluttes.');render()}else{status('Forbinder til fælles database …');render();try{const app=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');api=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js');auth=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js');const f=app.initializeApp(firebaseConfig);await auth.signInAnonymously(auth.getAuth(f));db=api.getDatabase(f);online=true;avail={};games={};api.onValue(api.ref(db),snap=>{const v=snap.val()||{};avail=v.playerAvailability||{};games=v.games||{};ready=true;render()},e=>{ready=false;notice('Databasefejl: '+e.message);render()});api.onValue(api.ref(db,'.info/connected'),s=>status(s.val()?'Fælles database · online':'Fælles database · forbindelse afbrudt'))}catch(e){ready=false;status('Forbindelsesfejl');notice('Fælles lagring er ikke tilgængelig: '+e.message);render()}}
</script></body></html>
